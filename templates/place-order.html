<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Order | SportsEzone</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800 flex flex-col">

  <!-- ================= HEADER ================= -->
  <header class="border-b bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <h1 class="text-xl font-bold text-green-700">SportsEzone</h1>

      <nav class="hidden md:flex gap-6 text-sm font-medium text-gray-700">
        <a href="#" class="hover:text-green-700">Products</a>
        <a href="#" class="hover:text-green-700">Brands</a>
        <a href="#" class="hover:text-green-700">My Orders</a>
      </nav>

      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-600">Hello, Linga</span>
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-green-700 text-sm font-semibold text-white">
          L
        </div>
      </div>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="flex-1 px-4">

    <!-- Back Link -->
    <div class="max-w-7xl mx-auto pt-6">
      <a
        href="/products"
        class="inline-flex items-center gap-2 mb-4
               text-sm font-medium text-green-600
               hover:text-green-700 hover:underline"
      >
        ← Back to Products
      </a>
    </div>

    <!-- Order Card -->
    <div class="flex items-center justify-center py-10">
      <div class="w-full max-w-md rounded-lg border bg-white p-6">

        <h2 class="text-lg font-semibold text-gray-900">Place your order</h2>
        <p class="mt-1 text-sm text-gray-500">Review the product and confirm your order</p>

        <!-- Product Summary -->
        <div class="mt-5 rounded-lg bg-gray-50 p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-semibold text-green-700">Soccer Cleats</h3>
              <p class="text-sm text-gray-600">Adidas Unisex Adult Goletto</p>
              <p class="mt-1 text-xs text-gray-500">📍 Ships from Michigan</p>
            </div>
            <span class="font-bold text-gray-900">$49.32</span>
          </div>
        </div>

        <form class="mt-5 space-y-4">

          <!-- Quantity -->
          <div>
            <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
            <input
              id="quantity"
              type="number"
              min="1"
              value="1"
              class="mt-1 w-full rounded-lg border px-3 py-2 text-sm
                     focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Total -->
          <div class="flex justify-between border-t pt-4 text-sm">
            <span class="font-medium text-gray-700">Total</span>
            <span class="font-bold text-gray-900">$49.32</span>
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-green-700 py-2.5
                   font-semibold text-white
                   hover:bg-green-800
                   focus:outline-none focus:ring-2 focus:ring-green-500"
          >
            Place Order
          </button>

          <!-- Success Message -->
          <p class="text-center text-sm text-green-600">
            Order placed successfully
          </p>

          <!-- Error Message (preview) -->
          <!--
          <p class="text-center text-sm text-red-600">
            Could not place order. Please try again.
          </p>
          -->

        </form>
      </div>
    </div>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="border-t bg-white">
    <div class="mx-auto max-w-7xl px-4 py-6 text-center text-sm text-gray-500">
      © 2026 SportsEzone | All rights reserved
    </div>
  </footer>

</body>
</html>
